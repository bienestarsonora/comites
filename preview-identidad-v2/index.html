<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa v2 · Comités</title>
<style>
html,body{margin:0;height:100%;background:#eee;font-family:Arial,sans-serif}.bar{min-height:44px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 12px;text-align:center}.bar strong{margin-right:6px}.wrap{height:calc(100% - 44px)}iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="bar"><strong>VISTA PREVIA V2:</strong> homologación institucional de Comités. El sitio público original permanece sin cambios.</div>
<div class="wrap"><iframe id="site" src="../" title="Vista previa institucional de Comités"></iframe></div>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d) return;
    const old=d.getElementById('preview-identidad-v2-css'); if(old) old.remove();
    const l=d.createElement('link'); l.id='preview-identidad-v2-css'; l.rel='stylesheet'; l.href='preview-identidad-v2/styles.css?v=20260917-2'; d.head.appendChild(l);
    const theme=d.querySelector('meta[name="theme-color"]'); if(theme) theme.setAttribute('content','#410123');
    d.title='Vista previa institucional · '+d.title;

    if(!d.getElementById('govBreadcrumbPreview')){
      const header=d.querySelector('.site-header');
      if(header){
        const bc=d.createElement('div');
        bc.id='govBreadcrumbPreview';
        bc.setAttribute('aria-label','Ruta de navegación');
        bc.innerHTML='<div style="width:min(1180px,calc(100% - 40px));margin:auto;padding:8px 0;font:400 12px/1.4 Roboto,Arial,sans-serif;color:#666">Inicio &nbsp;/&nbsp; Secretaría de Bienestar &nbsp;/&nbsp; <strong style="color:#410123">Comités</strong></div>';
        bc.style.background='#f7f7f7'; bc.style.borderBottom='1px solid #ddd';
        header.insertAdjacentElement('afterend',bc);
      }
    }

    if(!d.querySelector('.gov-preview-footer')){
      const footerBottom=d.querySelector('.footer-bottom');
      const footerContainer=footerBottom?.parentElement || d.querySelector('footer .container');
      if(footerContainer){
        const extra=d.createElement('div');
        extra.className='gov-preview-footer';
        extra.innerHTML='<div><strong>Gobierno del Estado de Sonora</strong><span>Secretaría de Bienestar · Micrositio de Comités</span></div><div><strong>Información institucional</strong><span>Políticas de uso y privacidad · Transparencia · Contacto</span></div><div><strong>Atención ciudadana</strong><span>Denuncia y orientación institucional · Emergencias 911</span></div>';
        footerContainer.appendChild(extra);
      }
    }
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
